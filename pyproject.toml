[project]
name = "phologtolabstreaminglayer"
version = "0.3.8"
description = "a complete but minimal python app that allows the user to take timestampped notes to labstreaminglayer with EventBoard functionality"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "attrs>=22.2.0,<23",
    "comtypes>=1.4.16,<2 ; platform_system == 'Windows'",
    "cython>=3.2.4,<4",
    "dtw-python>=1.7.4,<2",
    "keyboard>=0.13.5,<0.14",
    "lab-recorder-python>=0.3.2,<0.4",
    "matplotlib>=3.10.9,<4",
    "mne>=1.12.1,<2",
    "mne-lsl>=1.12.0,<2",
    "pillow>=12.2.0,<13",
    "psutil>=7.2.2,<8",
    "pyinstaller>=6.20.0,<7",
    "pylsl>=1.18.2,<2",
    "pystray>=0.19.5,<0.20",
    "pytz>=2026.1.post1,<2027",
    "pywin32>=311,<312 ; platform_system == 'Windows'",
    "pyxdf>=1.17.4,<2",
    "setuptools>=80.10.2,<81",
    "sounddevice>=0.5.5,<0.6",
    "soundfile>=0.13.1,<0.14",
    # "torch>=2.7.1; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "torch ; platform_machine == 'x86_64' and platform_system == 'Darwin'",
    "torch>=2.0.0,<2.1.0; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    # "torch; platform_system != 'Darwin' or platform_machine != 'x86_64'",
    "wheel>=0.47.0,<0.48",
    "whisper-timestamped>=0.2.5,<0.3",
    "phopylslhelper>=1.0.5,<2",
    "influxdb-client>=1.50.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phologtolabstreaminglayer"]


[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]

[project.scripts]
logger_app = "phologtolabstreaminglayer.console:console_main"

[tool.uv.sources]
lab-recorder-python = { path = "../lab-recorder-python", editable = true }
whisper-timestamped = { path = "../whisper-timestamped", editable = true }
phopylslhelper = { path = "../PhoPyLSLhelper", editable = true }

phopyqthelper = { path = "../phopyqthelper", editable = true }

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
phologtolabstreaminglayer = { path = ".", editable = true }

[tool.pixi.tasks]
